sonar.projectKey=Math-API
sonar.projectName=Math-API
sonar.host.url=http://sonarqube:9000

# Cibler uniquement les fichiers/dossiers du code applicatif
sonar.sources=Controllers,Routes,server.js

# Cibler le dossier de tests
sonar.tests=Tests

# Exclusions additionnelles
sonar.exclusions=**/node_modules/**, coverage/**, public/**, **/*.html

# Chemin du rapport de couverture LCOV
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.scm.disabled=true
