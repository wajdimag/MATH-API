sonar.projectKey=Math-API
sonar.projectName=Math-API
sonar.host.url=http://sonarqube:9000

# Source and Test directories
sonar.sources=.
sonar.tests=Tests

# Exclude tests and generated reports from source analysis
sonar.exclusions=**/node_modules/**, coverage/**, Tests/**, test/**, **/*.test.js, **/*.html, public/**
sonar.test.inclusions=Tests/**/*.js, **/*.test.js

# Coverage report location
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.scm.disabled=true
